---
name: Continuous Delivery

# yamllint disable-line rule:truthy
on:
  # yamllint disable-line rule:empty-values
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  release-and-clean:
    name: Release the code & clean up
    permissions:
      contents: write
      statuses: write
    uses: ./.github/workflows/cd-release.yaml
