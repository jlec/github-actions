---
name: Linting

# yamllint disable-line rule:truthy
on:
  # yamllint disable-line rule:empty-values
  workflow_call:
    secrets:
      ansible-deploy-keys:
        required: false
    inputs:
      ansible-support:
        default: false
        required: false
        type: boolean

env:
  ANSIBLE_FORCE: ${{ vars.ANSIBLE_FORCE }}

jobs:
  linting:
    name: linting
    runs-on: ubuntu-latest
    env:
      PY_RUNNER: ""
      HAS_ANSIBLE_KEY: ${{ secrets.ansible-deploy-keys != '' }}
    steps:
      - name: Generate token
        id: app-token
        if: github.actor != 'dependabot[bot]'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GHA_CLIENT_ID }}
          private-key: ${{ secrets.GHA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      # yamllint disable-line rule:line-length
      - run: "git config --global url.'https://jlec:${{ steps.app-token.outputs.token || github.token }}@github.com/'.insteadOf https://github.com/"
      # yamllint disable-line rule:line-length
      - run: "git config --global url.'https://jlec:${{ steps.app-token.outputs.token || github.token }}@github.com/'.insteadOf 'https://github.com/'"
      - run: "git config --global url.'https://'.insteadOf git://"
      - run: "git config --global user.name jlec"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Set up to your needs
          # cache:
          python-version: "3.13"
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        if: ${{ inputs.ansible-support && env.HAS_ANSIBLE_KEY == 'true' }}
        with:
          ssh-private-key: >-
            ${{ secrets.ansible-deploy-keys }}
      - name: Setup GIT user
        uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2
      - name: Install GO
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Enable of go.sum is present
          # cache: true
          go-version: "1.25"
      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@aefb0a43c4f5503a91fefb307745c4d51c26ed0e # v3.0.2
        with:
          terragrunt-version: latest
      - name: Install shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ansible deps in deployment
        run: "if [[ -d deployment ]]; then cd deployment && task ansible-init; fi"
      - name: Install ansible deps in packer
        run: "if [[ -d packer ]]; then cd packer && task ansible-init; fi"
      - name: Install ansible deps
        run: "task ansible-init"
      - name: Install OpenTOFU
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
      - name: Run pre-commit against all files
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # yamllint disable-line rule:line-length
          SKIP: detect-aws-credentials,mypy,protect-first-parent,tofu_docs,tofu_providers_lock,tofu_tflint,tofu_tfsec,tofu_checkov,terrascan,helm-docs-built,go-vet,go-unit-tests,go-static-check,tfupdate,tofu_validate,terragrunt_validate
      # RUN GITLEAKS
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        if: ${{ github.repository_owner == 'jlec' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
